[package]
name = "xcl-update"
description = "便携版自更新：清单解析、签名校验、exe 原地替换。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
xcl-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
semver = "1"
# 只解压不压缩，而且只要 deflate：其他算法（bzip2/zstd/aes）用不上，不编进来
zip = { version = "2", default-features = false, features = ["deflate"] }
# 只用来验签（不签名、不生成密钥），不需要 rand 与 pkcs8
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
