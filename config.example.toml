# 部署配置模板。
#
# 复制成 `config.toml` 放到数据根（exe 同级 `data/` 或 `%APPDATA%\XCL`），
# 或者直接往已有的 `config.toml` 里补这几个键。
#
# 这些地址不进代码：仓库里没有默认值，自己填自己的服务端。
# 空着就是功能不启用（更新不检查、联机不可用、账号登录不可用）。

[connect]
# 共享节点地址（tcp://host:11010）。空着就不能开房 —— 好友没有可连的节点。
relay = ""

# 联机组件清单地址。空着就没有联机功能。
manifestUrl = ""

# 账号服务地址（注册 / 登录 / 令牌续期）。
# 环境变量 XCL_ACCOUNT_SERVER 优先于这里（本地联调用）。
accountServer = ""

[update]
# 更新清单地址。空着就不检查更新。
manifestUrl = ""
