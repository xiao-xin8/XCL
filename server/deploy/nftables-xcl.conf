#!/usr/sbin/nft -f
#
# 在内核层先挡一道：应用层的限流再快，包也已经进了进程。
#
# 用法：
#   nft -f deploy/nftables-xcl.conf          # 应用
#   nft list table inet xcl_guard            # 查看当前规则
#   nft delete table inet xcl_guard          # 撤销（熔断排查时用）
#
# 这是叠加规则：新建一张自己的表，不碰你已有的表。独立成表的好处是撤起来干净 ——
# 出问题时一条 delete 就回到原样，不用在一堆规则里找哪条是自己加的。

table inet xcl_guard {
    chain input {
        type filter hook input priority -10; policy accept;

        # 只有「新建连接」限速；已经建立的隧道不受影响 ——
        # 正在玩的玩家不能在限流里被误伤。
        #
        # 超出直接 drop，不回 RST。
        tcp dport 11010 ct state new limit rate over 200/second burst 400 packets drop
    }
}
